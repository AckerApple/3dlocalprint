<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Local Print Backend API Map</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
      body {
        margin: 0;
        background: #f8fafc;
        color: #111827;
      }

      .api-docs-header {
        padding: 18px 24px;
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .api-docs-header h1 {
        margin: 0 0 6px;
        font-size: 1.35rem;
      }

      .api-docs-header p {
        margin: 0;
        max-width: 900px;
        color: #4b5563;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <header class="api-docs-header">
      <h1>3D Local Print Backend API Map</h1>
      <p>
        Firestore is the backing store for this Firebase backend. These HTTP endpoints are the supported surface for checkout, public lookups, agreements, quote requests, admin order actions, email actions, and Stripe webhooks.
      </p>
    </header>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.addEventListener("load", () => {
        window.ui = SwaggerUIBundle({
          url: "./backend/openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayOperationId: false,
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 1,
          docExpansion: "list",
          presets: [
            SwaggerUIBundle.presets.apis
          ],
          layout: "BaseLayout"
        });
      });
    </script>
  </body>
</html>
